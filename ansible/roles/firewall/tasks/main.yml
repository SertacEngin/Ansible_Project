- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Allow SSH
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow HTTP
  ufw:
    rule: allow
    port: 80
    proto: tcp

- name: Allow node_exporter
  ufw:
    rule: allow
    port: 9100
    proto: tcp

- name: Set default deny incoming
  ufw:
    state: enabled
    policy: deny
